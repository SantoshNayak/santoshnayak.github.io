<div class="section" id="certifications">
  <div class="container cc-certifications">
    <div class="h4 text-center mb-4 title">Certifications</div>
    <div class="row">
      <div class="col-lg-4 col-md-6 col-sm-12 mb-4" *ngFor="let cert of certifications" data-aos="fade-up" data-aos-duration="500">
        <div class="card h-100">
            <div class="card-body">
              <div class="certification-header d-flex align-items-center mb-3">
                <div class="cert-logo me-3">
                    <img src="{{ cert.logo }}" alt="">
                  <!-- <i class="fa fa-certificate text-primary" style="font-size: 2rem;"></i> -->
                </div>
                <div class="cert-info flex-grow-1">
                  <h5 class="card-title mb-1">{{ cert.name }}</h5>
                  <p class="text-muted mb-0">{{ cert.issuer }}</p>
                </div>
              </div>
              
              <div class="cert-details">
                <div class="cert-meta mb-2">
                  <small class="text-muted">
                    <i class="fa fa-calendar me-1"></i>
                    Issued: {{ cert.date }}
                    <span *ngIf="cert.expires"> • Expires: {{ cert.expires }}</span>
                  </small>
                </div>
                
                <div class="cert-credential mb-3" *ngIf="cert.credentialId">
                  <small class="text-muted">
                    <i class="fa fa-id-card me-1"></i>
                    Credential ID: {{ cert.credentialId }}
                  </small>
                </div>
                
                <div class="cert-skills mb-3" *ngIf="cert.skills && cert.skills.length > 0">
                  <span class="badge badge-outline-primary me-1 mb-1" *ngFor="let skill of cert.skills">
                    {{ skill }}
                  </span>
                </div>
                
                <div class="cert-actions">
                  <a 
                    [href]="cert.verifyUrl" 
                    target="_blank" 
                    class="btn btn-sm btn-outline-primary"
                    *ngIf="cert.verifyUrl && cert.verifyUrl !== '#'"
                  >
                    <i class="fa fa-external-link me-1"></i>
                    Verify Credential
                  </a>
                </div>
              </div>
            </div>
        </div>
      </div>
    </div>
    
    <!-- Call to Action -->
    <div class="row mt-4">
      <div class="col-md-12 text-center">
        <p class="text-muted">
          <i class="fa fa-info-circle me-1"></i>
          Continuously learning and staying updated with latest technologies and industry best practices
        </p>
      </div>
    </div>
  </div>
</div>
