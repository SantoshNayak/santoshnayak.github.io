<section class="section section--ultra contact" id="contact" aria-labelledby="contact-title">
  <div class="wrap contact__grid">
    <div class="contact__main">
      <h2 class="contact__title" id="contact-title">Let's build something extraordinary together</h2>

      <ul class="contact__links">
        <li>
          <a class="contact__link contact__link--lead" href="mailto:santoshnayak1996@gmail.com">
            <span class="contact__label">Email</span>
            <span class="contact__value">santoshnayak1996@gmail.com</span>
            <svg class="contact__arrow" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/></svg>
          </a>
        </li>
        <li>
          <a class="contact__link" href="https://www.linkedin.com/in/iamsantoshnayak/" target="_blank" rel="noopener">
            <span class="contact__label">LinkedIn</span>
            <span class="contact__value">iamsantoshnayak</span>
            <svg class="contact__arrow" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/></svg>
          </a>
        </li>
        <li>
          <a class="contact__link" href="https://github.com/santoshnayak" target="_blank" rel="noopener">
            <span class="contact__label">GitHub</span>
            <span class="contact__value">santoshnayak</span>
            <svg class="contact__arrow" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/></svg>
          </a>
        </li>
      </ul>

      <p class="contact__status">
        <span class="contact__mark" aria-hidden="true"></span>
        Available for opportunities
      </p>
    </div>

    <figure class="contact__fig">
      <svg class="contact__rings" viewBox="0 0 400 400" role="img" aria-label="Two wave sources, in step, drawing a still interference pattern of rings.">
        <g fill="none" stroke="#eef0f7" stroke-width="1.2">
          <circle *ngFor="let r of rings" cx="130" cy="200" [attr.r]="r"/>
        </g>
        <g fill="none" stroke="#ff4b1f" stroke-width="2.2">
          <circle *ngFor="let r of rings" cx="270" cy="200" [attr.r]="r"/>
        </g>
        <circle cx="130" cy="200" r="6" fill="#eef0f7"/>
        <circle cx="270" cy="200" r="7" fill="#ff4b1f" stroke="#eef0f7" stroke-width="2"/>
      </svg>
      <figcaption class="contact__figcap">Fig. 2. Physics and Code, in step.</figcaption>
    </figure>
  </div>
</section>
