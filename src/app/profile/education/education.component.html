<section class="section" id="education" aria-labelledby="education-title">
  <div class="wrap">
    <header class="section-head">
      <h2 class="section-title" id="education-title">Education</h2>
      <p class="section-caption">The route from physics to computing, in two degrees.</p>
    </header>

    <ol class="degrees">
      <li class="degree" *ngFor="let entry of entries">
        <p class="degree__when num">{{ entry.years }}</p>
        <div class="degree__body">
          <h3 class="degree__name">{{ entry.degree }}</h3>
          <p class="degree__school">{{ entry.school }}</p>
          <ul class="degree__points">
            <li *ngFor="let point of entry.points">{{ point }}</li>
          </ul>
        </div>
      </li>
    </ol>
  </div>
</section>
