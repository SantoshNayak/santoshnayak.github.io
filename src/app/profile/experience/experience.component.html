<section class="section section--alt" id="experience" aria-labelledby="experience-title">
  <div class="wrap">
    <header class="section-head">
      <h2 class="section-title" id="experience-title">Work experience</h2>
      <p class="section-caption">Five roles across two companies, each with the outcomes it delivered.</p>
    </header>

    <ol class="ledger">
      <li class="role" *ngFor="let role of roles; let first = first" [class.role--current]="first">
        <p class="role__when num">{{ role.period }}</p>
        <div class="role__rail" aria-hidden="true"></div>
        <div class="role__body">
          <h3 class="role__title">{{ role.title }}</h3>
          <p class="role__company">
            {{ role.company }}
            <span class="role__badge" *ngIf="role.badge">{{ role.badge }}</span>
          </p>
          <p class="role__summary" *ngIf="role.summary">{{ role.summary }}</p>
          <ul class="role__bullets">
            <li *ngFor="let bullet of role.bullets">{{ bullet }}</li>
          </ul>
        </div>
      </li>
    </ol>
  </div>
</section>
