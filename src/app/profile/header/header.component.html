<header class="bar" [class.bar--solid]="solid || open">
  <div class="wrap bar__in">
    <a class="brand" href="#top" (click)="close()">Santosh Nayak</a>

    <button
      class="menu-btn"
      type="button"
      aria-controls="primary-nav"
      [attr.aria-expanded]="open"
      (click)="toggle()"
    >
      {{ open ? 'Close' : 'Menu' }}
    </button>

    <nav id="primary-nav" class="nav" [class.nav--open]="open" aria-label="Primary">
      <a
        *ngFor="let link of links"
        class="nav__link"
        [class.nav__link--active]="active === link.id"
        [href]="'#' + link.id"
        [attr.aria-current]="active === link.id ? 'true' : null"
        (click)="close()"
      >{{ link.label }}</a>
      <a class="nav__link" href="https://paytosantosh-34175.web.app/" target="_blank" rel="noopener">Pay Santosh</a>
      <a class="nav__link nav__link--ext" href="#contact" (click)="close()">Hire Me</a>
    </nav>
  </div>
</header>
