<section class="hero" aria-label="Introduction">
  <figure class="hero__scene" #stage>
    <canvas
      #scene
      class="hero__canvas"
      role="img"
      aria-label="Two wave sources, Physics and Code, send out rings that interfere. Moving the pointer, or tapping, moves the Code source."
    ></canvas>
    <span #physicsLabel class="src src--physics" aria-hidden="true">S<sub>1</sub> Physics</span>
    <span #codeLabel class="src src--code" aria-hidden="true">S<sub>2</sub> Code</span>
    <figcaption class="hero__fig">Fig. 1. Two sources, one interference pattern.<span class="hero__steer hero__steer--fine"> Move your pointer to steer Code.</span><span class="hero__steer hero__steer--touch"> Tap to steer Code.</span></figcaption>
  </figure>

  <div class="hero__bar">
    <div class="wrap hero__bar-in">
      <div class="hero__name">
        <h1 class="hero__title">Santosh Nayak</h1>
        <p class="hero__role">
          <span class="hero__prefix">I'm a </span><span class="hero__typed">{{ currentRole }}</span><span class="hero__cursor" aria-hidden="true">|</span>
        </p>
      </div>

      <div class="hero__copy">
        <p class="hero__tagline">From Physics to Code | Driven by Curiosity &amp; Engineering Excellence</p>
        <p class="hero__sub">Full-Stack Engineer &amp; Gen AI Builder | Architecting High-Performance Systems</p>
        <div class="hero__actions">
          <a class="btn btn--solid" href="#contact">Hire Me</a>
          <a class="btn btn--line" href="https://www.buymeacoffee.com/santoshnayak" target="_blank" rel="noopener"><span>Buy Me Coffee</span></a>
        </div>
      </div>
    </div>
  </div>
</section>
