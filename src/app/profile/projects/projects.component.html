<section class="section section--alt" id="projects" aria-labelledby="projects-title">
  <div class="wrap">
    <header class="section-head">
      <h2 class="section-title" id="projects-title">Projects</h2>
      <p class="section-caption">Built and shipped. Each one has a live demo.</p>
    </header>

    <ul class="projects">
      <li class="project" *ngFor="let project of projects">
        <a class="project__name" [href]="project.livedemo" target="_blank" rel="noopener">
          {{ project.title }}
          <svg class="project__arrow" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"/></svg>
        </a>
        <a class="text-link project__code" [href]="project.githurl" target="_blank" rel="noopener">GitHub</a>
      </li>
    </ul>
  </div>
</section>
