<div class="section" id="projects">
  <div class="container cc-education">
    <div class="h4 text-center mb-4 title">Projects</div>

    <pagination-controls (pageChange)="pageChanged($event)"></pagination-controls>
    <div class="row">

      <ng-container *ngFor="let project of projects| paginate: config">
        <div class="col-md-4 col-sm-6 animate-box" data-animate-effect="fadeInLeft">
          <div class="blog-entry">
            <div class="card">
              <!-- <video [src]="project.url" *ngIf="project.type == 'video'"></video> -->

              <video height="auto" controls="controls" preload="none" [poster]="project.imageUrl"
                *ngIf="project.type == 'video'" style="width:100%">
                <source type="video/mp4" [src]="project.videUrl">
              </video>


              <img class="card-img-top" *ngIf="project.type == 'image'" src={{project.imageUrl}}
                onerror="this.src = 'assets/images/gif.gif'" alt="Card image" style="width:100%">
              <div class="card-body">
                <h4 class="card-title">{{project.title}}</h4>
                <p>
                  {{project.desc}}
                </p>
                <h5 class="card-text"><b>Technology :</b> {{project.tech}} </h5>
                <!-- <h5 class="card-text"><a href={{project.mediumlink}}>Read Blog on this  Project</a></h5> -->

                <a href={{project.livedemo}} target="_blank" class="btn btn-primary stretched-link ml-2 mr-5">Live
                  Demo</a>
                <a href={{project.githurl}} target="_blank" class="btn btn-primary stretched-link">GithubLink</a>

              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <pagination-controls (pageChange)="pageChanged($event)"></pagination-controls>
  </div>
</div>
