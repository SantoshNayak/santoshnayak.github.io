<section class="section section--alt" id="projects" aria-labelledby="projects-title">
  <div class="wrap">
    <header class="section-head">
      <h2 class="section-title" id="projects-title">Projects</h2>
      <p class="section-caption">Built and shipped. Each one has a live demo.</p>
    </header>

    <ul class="projects">
      <li class="project" *ngFor="let project of projects">
        <img
          class="project__thumb"
          [src]="project.imageUrl"
          [alt]="project.title + ' screenshot'"
          loading="lazy"
          (error)="onImgError($event)"
        />
        <div class="project__body">
          <h3 class="project__title">{{ project.title }}</h3>
          <p class="project__desc">{{ project.desc }}</p>
          <p class="project__tech"><strong>Technology:</strong> {{ project.tech }}</p>
        </div>
        <div class="project__links">
          <a class="text-link" [href]="project.livedemo" target="_blank" rel="noopener">Live Demo</a>
          <a class="text-link" [href]="project.githurl" target="_blank" rel="noopener">GitHub</a>
        </div>
      </li>
    </ul>
  </div>
</section>
