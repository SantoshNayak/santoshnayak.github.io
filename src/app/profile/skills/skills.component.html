<section class="section" id="skills" aria-labelledby="skills-title">
  <div class="wrap">
    <header class="section-head">
      <h2 class="section-title" id="skills-title">Technical skills</h2>
      <p class="section-caption">Grouped by the job each one does.</p>
    </header>

    <div class="skills">
      <section class="skill-row" *ngFor="let group of groups">
        <div class="skill-row__head">
          <h3 class="skill-row__title">{{ group.title }}</h3>
          <p class="skill-row__intro">{{ group.intro }}</p>
        </div>
        <ul class="skill-row__items">
          <li *ngFor="let item of group.items">{{ item }}</li>
        </ul>
      </section>
    </div>
  </div>
</section>
